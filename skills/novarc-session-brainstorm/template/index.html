<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: documento claro NOVARC (direção Clara, só modo claro), índice lateral fixo em tela larga, bancada técnica do simulador em tela cheia. */
:root {
  color-scheme: light;
  --navy-900: #04122e; --navy-700: #0b2350; --navy-500: #1b3e78; --navy-300: #5b7ba6; --navy-100: #b9c6da;
  --signal-600: #0554cc; --signal-500: #0a6cff; --signal-300: #6ba6ff; --signal-100: #d3e4ff; --signal-50: #eef4ff;
  --gray-900: #1f2937; --gray-700: #374151; --gray-500: #6b7280; --gray-300: #cbd5e1; --gray-200: #e5e7eb; --gray-100: #eef0f3; --gray-50: #f4f5f7; --white: #ffffff;
  --ok: #047857; --ok-50: #e7f5ef; --ok-200: #bfe3d1; --warn: #b45309; --warn-50: #fdf3e7; --warn-200: #f3d9b6; --bad: #b91c1c; --bad-50: #fbe9e9;
  --line: rgba(4, 18, 46, 0.09); --line-2: rgba(4, 18, 46, 0.16);
  --sans: "Sora", "Helvetica Neue", Helvetica, sans-serif; --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace; --term: "JetBrains Mono", "IBM Plex Mono", Menlo, monospace;
  --r-control: 8px; --r-card: 12px; --r-panel: 16px;
  --shadow-card: 0 1px 2px rgba(4, 18, 46, 0.06), 0 8px 24px -12px rgba(4, 18, 46, 0.10);
  --shadow-raised: 0 2px 4px rgba(4, 18, 46, 0.08), 0 18px 40px -16px rgba(4, 18, 46, 0.18);
  --shadow-overlay: 0 24px 64px rgba(4, 18, 46, 0.22);
  --focus: 0 0 0 3px rgba(10, 108, 255, 0.28);
}
* { box-sizing: border-box }
html { scroll-behavior: smooth }
body { background: var(--white); color: var(--gray-700); font-family: var(--sans); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased }
h1, h2, h3, h4 { color: var(--navy-900); font-weight: 600; text-wrap: balance; margin: 0 }
p { margin: 0; text-wrap: pretty }
a { color: var(--signal-600); text-underline-offset: 3px }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 6px }
.kicker { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; color: var(--signal-600) }
.lbl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray-500) }
.tnum { font-variant-numeric: tabular-nums }
.small { font-size: 13px } .muted { color: var(--gray-500) }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round }

/* casca: índice lateral + página */
.shell { display: block }
.toc { display: none; font-family: var(--mono); font-size: 12px }
.page { max-width: 1080px; margin: 0 auto; padding: 32px 24px 96px }
@media (min-width: 1180px) {
  .shell { display: grid; grid-template-columns: 210px minmax(0, 1080px); gap: 40px; justify-content: center; padding-inline: 24px }
  .toc { display: block; position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; padding-top: 40px; max-height: 100vh; overflow-y: auto }
  .page { margin: 0; padding-inline: 0 }
}
@media (max-width: 640px) { .page { padding: 20px 16px 72px } }
.toc a { display: grid; grid-template-columns: 28px 1fr auto; gap: 0 6px; align-items: baseline; padding: 6px 0 6px 12px; color: var(--gray-500); text-decoration: none; border-left: 2px solid var(--line) }
.toc a .n { font-size: 11px; color: var(--navy-300) }
.toc a:hover { color: var(--navy-900); border-left-color: var(--line-2) }
.toc a.on { color: var(--navy-900); border-left-color: var(--signal-500) } .toc a.on .n { color: var(--signal-600) }
.toc .badge { font-size: 10px; padding: 0 6px; border-radius: 999px; background: var(--warn-50); color: var(--warn) }
.toc .cap { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray-500); margin: 0 0 10px 14px }
.toc .gear { margin: 18px 0 0 12px }

/* cabeçalho */
.masthead { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding-bottom: 20px; border-bottom: 2px solid var(--navy-900) }
.masthead svg.logo { display: block; width: 140px; height: auto }
.masthead .mh-r { display: flex; flex-direction: column; align-items: flex-end; gap: 10px }
.quem { display: flex; align-items: center }
.quem .av { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--white); margin-left: -6px; background: var(--c, var(--navy-300)); color: #fff; font: 600 11px/22px var(--sans, inherit); text-align: center; overflow: hidden; flex: none }
.quem .av:first-child { margin-left: 0 }
.quem .av img { width: 100%; height: 100%; object-fit: cover; display: block }
.quem .n { margin-left: 8px; font-family: var(--mono); font-size: 11px; color: var(--gray-500) }
#cursores { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 70 }
#cursores .cur { position: absolute; left: 0; top: 0; will-change: transform; transition: transform 90ms linear }
#cursores .cur svg { display: block; filter: drop-shadow(0 1px 1px rgba(4, 18, 46, .3)) }
#cursores .cur span { position: absolute; left: 14px; top: 14px; background: var(--c); color: #fff; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap }
#cursores.fixo { position: fixed }
.vendo { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--signal-600); background: var(--signal-50); border: 1px solid var(--signal-100); border-radius: 999px; padding: 2px 10px; margin-top: 6px }
.vendo i { width: 8px; height: 8px; border-radius: 50%; background: var(--c) }
@media (prefers-reduced-motion: reduce) { #cursores .cur { transition: none } }
.masthead .meta { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray-500); text-align: right; line-height: 1.8 }
.hero { padding: 36px 0 28px; position: relative }
.hero h1 { font-size: clamp(34px, 5vw, 56px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 700; margin: 6px 0 16px; max-width: 18ch }
.hero .lead { font-size: 20px; line-height: 1.35; letter-spacing: -0.015em; color: var(--navy-900); max-width: 46em; margin-bottom: 16px }
.byline { display: flex; flex-wrap: wrap; gap: 6px 22px; font-family: var(--mono); font-size: 13px; color: var(--gray-500) }
.byline b { color: var(--navy-900); font-weight: 500 }
.slash { display: inline-block; width: 8px; height: 22px; background: var(--signal-500); transform: skewX(-14deg); margin-right: 12px; vertical-align: -4px }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 24px 0 8px }
@media (max-width: 760px) { .stats { grid-template-columns: 1fr 1fr } }
.stat { border-top: 2px solid var(--navy-900); padding-top: 12px }
.stat .v { font-size: 32px; line-height: 1.1; letter-spacing: -0.025em; font-weight: 600; color: var(--navy-900); font-variant-numeric: tabular-nums }
.stat .v small { font-size: 14px; color: var(--gray-500); font-weight: 500; letter-spacing: 0; margin-left: 4px }
.stat .k { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--signal-600); margin-top: 6px }
.stat .meter { height: 6px; border-radius: 999px; background: var(--signal-100); overflow: hidden; margin-top: 8px } .stat .meter i { display: block; height: 100%; background: var(--signal-500) }
.stat .meter.ok { background: var(--ok-50) } .stat .meter.ok i { background: var(--ok) }

/* seções */
section.sec { padding: 40px 0; border-top: 1px solid var(--line); scroll-margin-top: 16px }
section.sec[hidden] { display: none }
.sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px }
.sec-head h2 { font-size: 30px; letter-spacing: -0.025em; line-height: 1.15; margin-top: 4px }
.sec-head p { color: var(--gray-500); max-width: 46em; margin-top: 6px }
.card { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow-card) }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 16px }
/* Quatro cartões em três colunas deixam um sozinho na linha: com quatro, dois por linha. */
.grid2:has(> :nth-child(4):last-child) { grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)) }
.callout { border: 1px solid var(--line); border-left: 4px solid var(--signal-500); border-radius: var(--r-card); padding: 14px 18px; background: var(--gray-50) }
.callout.warn { border-left-color: var(--warn) } .callout.bad { border-left-color: var(--bad) }
.empty { padding: 20px; border: 1px dashed var(--line-2); border-radius: var(--r-card); color: var(--gray-500); font-size: 14px }
.empty b { display: block; color: var(--navy-900); font-weight: 600; margin-bottom: 4px }

/* controles */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--white); color: var(--navy-900); font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.02em; cursor: pointer; text-decoration: none; white-space: nowrap; transition: border-color .12s, transform .12s }
.btn:hover { border-color: var(--navy-300); transform: translateY(-1px) }
.btn.primary { background: var(--signal-500); border-color: var(--signal-500); color: #fff; box-shadow: 0 1px 2px rgba(5, 84, 204, 0.30), 0 10px 24px -8px rgba(10, 108, 255, 0.45) }
.btn.dark { background: var(--navy-900); border-color: var(--navy-900); color: #fff }
.btn.ghost { border-color: transparent; background: transparent; color: var(--gray-500) } .btn.ghost:hover { color: var(--navy-900); background: var(--gray-100) }
.btn.sm { height: 30px; padding: 0 11px; font-size: 12px }
.btn.icon { width: 32px; padding: 0; justify-content: center }
.btn[disabled] { opacity: .4; pointer-events: none }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid transparent }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.pill.neutral { background: var(--gray-100); color: var(--gray-700) } .pill.info { background: var(--signal-50); color: var(--signal-600); border-color: var(--signal-100) }
.pill.ok { background: var(--ok-50); color: var(--ok); border-color: var(--ok-200) } .pill.warn { background: var(--warn-50); color: var(--warn); border-color: var(--warn-200) } .pill.bad { background: var(--bad-50); color: var(--bad) }
.chip { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--gray-500); white-space: nowrap }
.chip.t-NOVO { color: var(--signal-600); background: var(--signal-50); border-color: var(--signal-100) } .chip.t-ALTERADO { color: var(--warn); background: var(--warn-50); border-color: var(--warn-200) } .chip.t-REAPROVEITA, .chip.ok { color: var(--ok); background: var(--ok-50); border-color: var(--ok-200) }
.nmark { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 999px; background: var(--navy-900); color: #fff; font-family: var(--mono); font-size: 12px; font-weight: 500 }
.ref { font-family: var(--mono); font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--gray-100); color: var(--gray-700); word-break: break-all }
input[type=text], input[type=url], input[type=date], input[type=number], select, textarea { background: var(--white); border: 1px solid var(--line-2); border-radius: var(--r-control); padding: 8px 10px; min-height: 36px; width: 100% }
textarea { min-height: 84px; resize: vertical }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--gray-500) }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; overflow-x: auto; background: var(--white); flex-wrap: nowrap; width: max-content; max-width: 100%; justify-self: start; align-self: start }
.seg button { white-space: nowrap }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-family: var(--mono); font-size: 12px; color: var(--gray-700); cursor: pointer }
.seg button + button { border-left: 1px solid var(--line) }
.seg button[aria-pressed=true] { background: var(--navy-900); color: #fff }
.seg button:disabled { cursor: default; opacity: .55 }

.opts { display: flex; flex-wrap: wrap; gap: 6px }
.opts button { border: 1px solid var(--line-2); background: var(--white); border-radius: 999px; padding: 4px 11px; font-family: var(--mono); font-size: 11.5px; color: var(--gray-700); cursor: pointer }
.opts button[aria-pressed=true] { background: var(--navy-900); border-color: var(--navy-900); color: #fff }
.fsel { width: auto; min-width: 150px; min-height: 32px; padding: 4px 8px; font-size: 13px }

/* explorador de mudanças */
.health { display: flex; height: 12px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--gray-100) }
.health i { display: block; height: 100% }
.legend { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 13px; margin-top: 10px }
.legend button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--gray-700); display: inline-flex; align-items: center; gap: 6px }
.legend button:hover { color: var(--navy-900); text-decoration: underline; text-underline-offset: 3px }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block }
.legend b { font-family: var(--mono); font-weight: 500; color: var(--navy-900) }
.fbar { display: grid; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line) }
.fbar .row { gap: 10px }
.srch { position: relative; flex: 1 1 220px; max-width: 320px } .srch svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--gray-500) } .srch input { padding-left: 32px }
.active-f { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--gray-50); align-items: center }
.fchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--signal-100); background: var(--signal-50); color: var(--signal-600); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 12px; cursor: pointer }
.fchip span { width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; font-family: var(--mono) } .fchip:hover span { background: var(--signal-100) }
.ex { display: grid; grid-template-columns: minmax(0, 1fr) }
@media (min-width: 960px) { .ex { grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr) } }
.ex-list { max-height: 78vh; overflow: auto; border-right: 1px solid var(--line) }
.ex-det { max-height: 78vh; overflow: auto; background: #fcfcfd }
@media (max-width: 959px) { .ex-det { display: none } .ex-list { max-height: none; border-right: 0 } }
.exg { position: sticky; top: 0; z-index: 1; background: var(--gray-50); border-bottom: 1px solid var(--line); padding: 8px 16px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray-500); display: flex; justify-content: space-between; gap: 8px }
.exr { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: start; width: 100%; text-align: left; padding: 10px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer }
.exr:hover { background: var(--gray-50) }
.exr.sel { background: var(--signal-50); box-shadow: inset 3px 0 0 var(--signal-500) }
.exr .tt { color: var(--navy-900); font-weight: 500; font-size: 14px; line-height: 1.35 }
.exr .mt { font-size: 12px; color: var(--gray-500); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.flags { display: flex; gap: 4px; align-items: center; padding-top: 2px }
.flag { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 999px; white-space: nowrap }
.flag svg.i { width: 12px; height: 12px }
.flag.p { background: var(--warn-50); color: var(--warn) } .flag.d { background: var(--ok-50); color: var(--ok) } .flag.n { background: var(--signal-50); color: var(--signal-600) }
.det { padding: 20px; display: grid; gap: 18px; align-content: start }
.det h3 { font-size: 22px; letter-spacing: -0.015em; line-height: 1.25 }
.det h3 .mid { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; color: var(--gray-500); font-weight: 500 }
.det .blk { display: grid; gap: 8px }
.lk { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: start; text-align: left; border: 1px solid var(--line); border-radius: var(--r-control); padding: 10px 12px; background: var(--white); font-size: 13px; width: 100% }
button.lk { cursor: pointer } button.lk:hover { border-color: var(--navy-300) }
.lk b { color: var(--navy-900); font-weight: 600 } .lk .tx { grid-column: 2; color: var(--gray-500); font-size: 12.5px; line-height: 1.5 }
.lk .tx.ans { color: var(--ok) }
.mini { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center }
.mini button { border: 1px solid var(--line-2); background: var(--white); border-radius: 999px; padding: 2px 10px 2px 3px; font-size: 12px; color: var(--navy-900); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; max-width: 100% }
.mini button:hover { border-color: var(--navy-300) }
.mini button .nm { width: 20px; height: 20px; border-radius: 999px; background: var(--navy-900); color: #fff; display: grid; place-items: center; font-family: var(--mono); font-size: 10px; flex: none }
.mini button span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.flash { animation: flash 1.4s ease-out }
@keyframes flash { 0% { background: var(--signal-100) } 100% { background: transparent } }
.bench-top svg.logo { width: 78px; height: auto; flex: none }
.bench-side .det, .bench-side .bx, .bench-side .bm .tt { font-family: var(--sans) }
.bt-n { font-size: 10.5px; color: var(--gray-500); margin-left: 2px }
.bench-tabs button[aria-pressed=true] .bt-n { color: var(--signal-600) }
.bx { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; font-size: 13px; color: var(--gray-700) }
.bx b { color: var(--navy-900); font-weight: 600 }
.mini button.here { border-color: var(--signal-300); background: var(--signal-50) }
.ready.neutral { background: var(--gray-100); color: var(--gray-700) }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 16px }
.fact { border-top: 2px solid var(--navy-900); padding-top: 12px; display: grid; gap: 4px }
.fact .fv { font-size: 20px; font-weight: 600; color: var(--navy-900); letter-spacing: -0.015em }
button.stat { border: 0; background: none; text-align: left; cursor: pointer; font: inherit; color: inherit; border-radius: 0 }
button.stat:hover .k { text-decoration: underline; text-underline-offset: 3px }
.simx { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); overflow: hidden }
@media (max-width: 860px) { .simx { grid-template-columns: 1fr } }
.simx .pv { position: relative; border: 0; cursor: pointer; padding: 32px; display: grid; place-items: center; background: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.10) 1px, transparent 0) 0 0 / 18px 18px, linear-gradient(160deg, #04122e, #0b2350 70%, #1b3e78) }
.simx .pv .shot { width: 100%; max-width: 440px; box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5); border-color: rgba(255, 255, 255, 0.12); transition: transform .2s }
.simx .pv:hover .shot { transform: translateY(-3px) }
.pv-cta { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); color: #fff; font-family: var(--mono); font-size: 12px; backdrop-filter: blur(4px) }
.simx .info { padding: 24px; display: grid; gap: 14px; align-content: start }
.simx .info h3 { font-size: 24px; letter-spacing: -0.02em }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px }
@media (max-width: 520px) { .kpis { grid-template-columns: 1fr 1fr } }
.kpi { border: 1px solid var(--line); border-radius: 10px; background: var(--white); padding: 10px 12px; text-align: left; cursor: pointer; display: grid; gap: 2px }
.kpi:hover { border-color: var(--navy-300) } .kpi b { font-size: 22px; font-weight: 600; color: var(--navy-900); font-variant-numeric: tabular-nums; line-height: 1.1 } .kpi span { font-size: 12px; color: var(--gray-500) }
.kpi.warn { border-color: var(--warn-200); background: var(--warn-50) } .kpi.warn b { color: var(--warn) }
.legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--gray-700) }
.simv { grid-column: 1 / -1; border-top: 1px solid var(--line); padding: 16px 24px 20px; display: grid; gap: 10px; background: var(--gray-50) }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px }
.vcard { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); text-decoration: none; color: inherit }
.vcard:hover { border-color: var(--navy-300) } .vcard .play { width: 44px; height: 44px; border-radius: 10px } .vcard b { display: block; color: var(--navy-900); font-weight: 600; font-size: 14px }
.vcard > span:last-child { display: grid; gap: 2px }
.lnk { border: 0; background: none; padding: 0; color: var(--signal-600); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; text-align: left }
.bfil { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; font-family: var(--sans) }
.bfil .srch { max-width: none } .bfil .fsel { flex: 1 1 140px; min-width: 0 } .bfil .legend { margin-top: 0; font-size: 12px }
.legend button[aria-pressed=true] { color: var(--navy-900); font-weight: 600; text-decoration: underline; text-underline-offset: 3px }
.bench-body { grid-template-columns: minmax(0, 1fr) 440px }
/* .seg vem com align-self: start (para não esticar em grade); na barra flex da bancada isso o colava no topo */
#bench-versao { align-self: center }
.sim-fonte { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100% }
/* ticket escolhido na bancada: cartão no painel com o pedido original, o achado e a solução */
/* o seletor encolhe antes de a barra passar da tela (com largura mínima, empurraria a lateral para fora) */
#bench { grid-template-columns: minmax(0, 1fr) } #bench-ticket { align-self: center; flex: 0 1 260px; min-width: 0 }
.tk-card { border: 1px solid var(--line-2); border-radius: var(--r-card); padding: 12px; display: grid; gap: 8px } .tk-card h4 { font-size: 15px; line-height: 1.3 } .tk-card .q { border-left: 3px solid var(--signal-500); padding-left: 10px; font-style: italic }
.bench-top .btn[aria-pressed=true] { background: var(--navy-900); border-color: var(--navy-900); color: #fff }
#bench.sem-painel .bench-body { grid-template-columns: minmax(0, 1fr) }
#bench.sem-painel .bench-side { display: none }
#bench-versao button { padding: 4px 10px; font-size: 11.5px }
/* a lateral não pode crescer pela largura mínima das abas: sem isso o painel passa da tela e corta o texto */
.bench-side { grid-template-columns: minmax(0, 1fr); min-width: 0; overflow: hidden }
.bench-side > * { min-width: 0 }
.bench-tabs { flex-wrap: wrap; overflow: visible }
.bench-tabs button { border-bottom-width: 2px }
/* superfícies do simulador (cliente, operador, WhatsApp, e-mail) e canais de mensagem: cabeçalho de grupo na lista */
.bsup { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; gap: 8px; padding: 7px 14px; background: var(--gray-50); border-bottom: 1px solid var(--line); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray-500) }
.bsup span:first-child { color: var(--navy-900) }

/* status */
.flow { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(130px, 1fr); gap: 12px; overflow-x: auto; padding: 4px 2px 10px }
.node { position: relative; border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px; background: var(--white); box-shadow: var(--shadow-card); font-size: 13px; line-height: 1.4 }
.node .who { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray-500); margin-bottom: 6px }
.node .t { font-weight: 600; color: var(--navy-900) }
.node::after { content: ""; position: absolute; right: -13px; top: 50%; width: 10px; border-top: 2px dashed var(--navy-100) }
.node:last-child::after { display: none }
.node.done { border-color: var(--ok-200); background: var(--ok-50) } .node.done .who { color: var(--ok) }
.node.now { border-color: var(--signal-300); background: var(--signal-50); box-shadow: var(--shadow-raised) } .node.now .who { color: var(--signal-600) }
.choice { display: grid; gap: 10px; padding: 16px }

/* simuladores */
.sim { display: grid; grid-template-columns: 220px 1fr; gap: 22px; padding: 20px; align-items: center }
.shot { aspect-ratio: 16/10; border-radius: 10px; background: #f8fafc; display: grid; grid-template-columns: 26% 1fr; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-card) }
.shot i { background: #0f172a; display: grid; align-content: start; gap: 5px; padding: 10px 8px } .shot i b { height: 5px; border-radius: 3px; background: #334155 } .shot i b:nth-child(2) { background: #2563eb }
.shot div { display: grid; gap: 7px; padding: 12px; align-content: start } .shot div b { display: block; height: 7px; border-radius: 3px; background: #dbe3ee }
.shot div b.k { height: 26px; background: #fff; border: 1px solid #e2e8f0 } .shot div .ks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px }
.shot .mk { width: 14px; height: 14px; border-radius: 50%; background: #c026d3; position: relative; justify-self: end; margin-top: -10px }
@media (max-width: 620px) { .sim { grid-template-columns: 1fr } }

/* fases */
.tl { overflow-x: auto; padding: 16px 16px 10px }
.tl-in { min-width: 680px }
.trow { display: grid; grid-template-columns: 210px 1fr; align-items: center; gap: 12px; height: 42px }
.trow .gl { color: var(--navy-900); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis } .trow .gl b { font-family: var(--mono); font-weight: 500; color: var(--signal-600); margin-right: 8px }
.track { position: relative; height: 26px; background: var(--gray-100); border-radius: 6px }
.tb { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: var(--signal-500); color: #fff; font-family: var(--mono); font-size: 11.5px; display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden }
.tb.cli { background: var(--navy-700) } .tb.done { background: var(--ok) }
.today { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--bad) }
.ticks { position: relative; height: 18px; font-family: var(--mono); font-size: 11px; color: var(--gray-500) } .ticks span { position: absolute; transform: translateX(-50%) }
.phase { display: flex; flex-direction: column; gap: 12px; padding: 20px }
/* Cartões da mesma linha têm a mesma altura: as ações ficam no pé, alinhadas entre eles. */
.phase > .row:last-child { margin-top: auto }
.phase .ph { display: flex; justify-content: space-between; align-items: center; gap: 10px }
.phase h3 { font-size: 20px; letter-spacing: -0.015em; line-height: 1.3 }
.phase ul { margin: 0; padding-left: 18px; font-size: 14px } .phase li { margin-block: 2px } .phase li::marker { color: var(--signal-600) }
.meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
.mtr { font-size: 12px; color: var(--gray-500) } .mtr b { display: block; font-family: var(--mono); font-size: 13px; color: var(--navy-900); font-weight: 500 }
.mtr .bar { height: 5px; border-radius: 999px; background: var(--gray-100); overflow: hidden; margin-top: 4px } .mtr .bar i { display: block; height: 100%; background: var(--signal-500) } .mtr .bar.ok i { background: var(--ok) } .mtr .bar.warn i { background: var(--warn) }
.ready { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-control); font-size: 14px }
.ready.ok { background: var(--ok-50); color: var(--ok) } .ready.block { background: var(--warn-50); color: var(--warn) }
.dist { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--gray-100); gap: 2px }
.dist i { display: block; height: 100% }

/* listas */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line) }
.toolbar input[type=text] { max-width: 260px }
details.grp { border-top: 1px solid var(--line) }
details.grp > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--navy-900) }
details.grp > summary::-webkit-details-marker { display: none }
details.grp > summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--signal-600); border-bottom: 2px solid var(--signal-600); transform: rotate(-45deg); transition: transform .12s; flex: none }
details.grp[open] > summary::before { transform: rotate(45deg) }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 14px 16px; border-top: 1px solid var(--line) }
.item:first-child { border-top: 0 }
.item h4 { font-size: 15px; font-weight: 600; line-height: 1.4 }
.item p { font-size: 14px; margin-top: 2px; max-width: 72em }
.refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px }
.acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end }
.answer { margin-top: 10px; padding: 10px 12px; border-radius: var(--r-control); background: var(--ok-50); color: var(--ok); font-size: 14px }
.group-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray-500); padding: 18px 16px 6px; display: flex; align-items: center; gap: 8px }
.notecount { font-family: var(--mono); font-size: 11px; color: var(--signal-600) }

/* biblioteca, horas, vídeos, histórico */
.doc { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line) }
.doc:first-child { border-top: 0 }
.dico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--signal-50); color: var(--signal-600) }
.dico.plano { background: var(--gray-100); color: var(--navy-900) } .dico.revisao { background: var(--ok-50); color: var(--ok) } .dico.reuniao { background: var(--warn-50); color: var(--warn) }
.bars { display: grid; gap: 8px }
.brow { display: grid; grid-template-columns: minmax(150px, 220px) 1fr 110px; gap: 12px; align-items: center; font-size: 13px }
.brow .bt { position: relative; height: 10px; background: var(--signal-100); border-radius: 999px; overflow: hidden } .brow .bt i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--signal-500); border-radius: 999px } .brow .bt i.over { background: var(--bad) }
.hnum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px } .hnum div { border-top: 2px solid var(--navy-900); padding-top: 6px } .hnum b { display: block; font-size: 22px; font-weight: 600; color: var(--navy-900); font-variant-numeric: tabular-nums } .hnum b.over { color: var(--bad) } .hnum span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--gray-500) }
.hpess { margin: -4px 0 4px; font-size: 12px }
.brow .bv { font-family: var(--mono); font-size: 12px; color: var(--navy-900); text-align: right; font-variant-numeric: tabular-nums }
.brow .bv small { color: var(--gray-500); font-size: 11px }
/* Rótulo e número numa linha, a barra embaixo em largura total: lida contra o previsto da própria fase. */
.hbloco .brow { grid-template-columns: 1fr auto; row-gap: 4px } .hbloco .brow .bt { grid-column: 1 / -1; order: 3 }
.brow .bt i.over { border-radius: 0 999px 999px 0 } .brow .bt b.prev { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--navy-900) }
.brow .bt.sem { background: var(--gray-100) } .brow .bt.sem i { background: var(--navy-300) } .brow.fora > span:first-child { color: var(--gray-500) } .brow.fora > span:nth-child(2) { white-space: nowrap }
.hsess .sid { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; padding: 2px 6px; border: 1px solid var(--gray-200); border-radius: 6px; background: var(--gray-50, #fff); color: var(--navy-900); font-family: var(--mono); font-size: 11.5px; cursor: pointer; word-break: break-all; text-align: left }
@media (max-width: 640px) { .brow { grid-template-columns: 1fr auto } .brow .bt { grid-column: 1 / -1; order: 3 } }
.brow.fora > span:nth-child(2) { order: 3; grid-column: 1 / -1 }
.hsess .sid:hover { border-color: var(--signal-500) } .hsess .hpath { display: block; font-family: var(--mono); font-size: 11px; word-break: break-all; margin-top: 2px }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px }
table.t th { text-align: left; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; color: var(--gray-500); padding: 8px 12px; border-bottom: 2px solid var(--navy-900); white-space: nowrap }
table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top } table.t td.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
.tbl { overflow-x: auto }
.vid { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line) }
.vid:first-child { border-top: 0 }
.play { width: 52px; height: 52px; border-radius: 12px; background: var(--navy-900); display: grid; place-items: center; color: #fff }
.hist { display: grid; grid-template-columns: 130px 1fr; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 14px } .hist:first-child { border-top: 0 }

/* modal, gaveta, avisos */
.modal { position: fixed; inset: 0; z-index: 80; background: rgba(4, 18, 46, 0.45); display: grid; place-items: center; padding: 16px }
.modal[hidden] { display: none }
.panel { background: var(--white); border-radius: var(--r-panel); box-shadow: var(--shadow-overlay); width: min(760px, 100%); max-height: 88vh; overflow: auto; padding: 24px; display: grid; gap: 14px }
.panel h3 { font-size: 20px }
.panel pre, .code { font-family: var(--term); font-size: 12.5px; line-height: 1.65; background: var(--navy-900); color: var(--navy-100); padding: 16px; border-radius: var(--r-card); white-space: pre-wrap; word-break: break-word; max-height: 52vh; overflow: auto; margin: 0; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12) }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); z-index: 65; background: var(--white); box-shadow: var(--shadow-overlay); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px) }
.drawer[hidden] { display: none }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line) }
.drawer .body { overflow: auto; padding: 20px; display: grid; gap: 20px; align-content: start }
.tog { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px }
.tog input { width: 18px; height: 18px; accent-color: var(--signal-500) }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy-900); color: #fff; padding: 10px 16px; border-radius: var(--r-card); box-shadow: var(--shadow-overlay); font-size: 14px; z-index: 90 }

/* bancada técnica do simulador */
.bench { position: fixed; inset: 0; z-index: 70; background: var(--gray-50); display: grid; grid-template-rows: 48px 1fr; font-family: var(--term) }
.bench[hidden] { display: none }
.bench-top { display: flex; align-items: center; gap: 12px; padding: 0 12px; padding-top: env(safe-area-inset-top, 0px); background: var(--white); border-bottom: 1px solid var(--line-2); font-size: 12px; color: var(--gray-700) }
.bench-top .crumb { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 } .bench-top .crumb b { color: var(--navy-900); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bench-top .sep { width: 3px; height: 16px; background: var(--signal-500); transform: skewX(-14deg) }
.bench-body { display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0 }
@media (max-width: 900px) { .bench-body { grid-template-columns: 1fr; grid-template-rows: 1fr 45% } }
.bench-frame { position: relative; min-height: 0; border-right: 1px solid var(--line-2); background: #fff }
.bench-frame iframe { width: 100%; height: 100%; border: 0; display: block }
.bench-side { display: grid; grid-template-rows: auto auto 1fr; min-height: 0; background: var(--white) }
.bench-tabs { display: flex; border-bottom: 1px solid var(--line-2) }
.bench-tabs { overflow-x: auto }
.bench-tabs button { padding-inline: 6px; flex: 1 0 auto; white-space: nowrap; border: 0; background: transparent; padding: 10px 8px; font-family: var(--term); font-size: 11.5px; color: var(--gray-500); cursor: pointer; border-bottom: 2px solid transparent }
.bench-tabs button[aria-pressed=true] { color: var(--navy-900); border-bottom-color: var(--signal-500) }
.bench-screen { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--gray-500); display: flex; justify-content: space-between; gap: 8px }
.bench-screen b { color: var(--navy-900); font-weight: 500 }
.bench-list { overflow: auto; min-height: 0 }
.bm { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 12px; line-height: 1.45 }
.bm:hover { background: var(--gray-50) } .bm.sel { background: var(--signal-50); box-shadow: inset 3px 0 0 var(--signal-500) }
.bm .nm { width: 24px; height: 24px; border-radius: 999px; background: var(--navy-900); color: #fff; display: grid; place-items: center; font-size: 11px }
.bm .tt { color: var(--navy-900); font-weight: 500; font-family: var(--sans); font-size: 13px }
.bm .mt { color: var(--gray-500); margin-top: 2px }
.bdet { padding: 14px; display: grid; gap: 12px; font-size: 12.5px }
.bdet h4 { font-family: var(--sans); font-size: 16px }
.bdet .why { font-family: var(--sans); font-size: 13.5px; color: var(--gray-700) }
.note { border: 1px solid var(--line); border-radius: var(--r-control); padding: 10px 12px; display: grid; gap: 4px }
.note .nt { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase }
.note.logica .nt { color: var(--signal-600) } .note.prova .nt { color: var(--ok) } .note.regra .nt { color: var(--navy-700) } .note.duvida .nt { color: var(--warn) }
.note p { font-family: var(--sans); font-size: 13px; color: var(--gray-700) }
.note .who { color: var(--gray-500); font-size: 11px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important } }
/* ============================================================ PRANCHA E MOVIMENTO
   Conceito: o plano como prancha técnica. Linhas finas, numeração em mono, poucos volumes.
   Movimento: cada peça se desenha uma vez, quando entra na tela (classe .in). Só roda com html.anim,
   que o script liga quando o sistema não pede menos movimento; sem ela, tudo aparece pronto. */
.page { counter-reset: sec }
section.sec { border-top: 0; position: relative; padding: 56px 0 }
section.sec:not([hidden]) { counter-increment: sec }
section.sec::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--line-2); transform-origin: left; transition: transform 1.1s cubic-bezier(.2, .7, .2, 1) }
.sec-head h2 { font-size: 34px; letter-spacing: -0.03em }
.sec-head .kicker::before { content: counter(sec, decimal-leading-zero) " /"; color: var(--navy-300); margin-right: 10px }
.card { box-shadow: none }
.card.phase { transition: border-color .2s, transform .25s cubic-bezier(.2, .7, .2, 1) }
.card.phase:hover { border-color: var(--line-2); transform: translateY(-2px) }

/* capa */
.hero { padding: 48px 0 32px; isolation: isolate }
.hero::before, .hero::after { content: ""; position: absolute; inset: 0 -24px; z-index: -1; pointer-events: none;
  background-image: radial-gradient(rgba(4, 18, 46, 0.11) 1px, transparent 1.3px); background-size: 18px 18px;
  -webkit-mask-image: linear-gradient(to bottom, #000 30%, transparent 92%); mask-image: linear-gradient(to bottom, #000 30%, transparent 92%) }
.hero::after { background-image: radial-gradient(rgba(10, 108, 255, 0.55) 1.2px, transparent 1.6px);
  -webkit-mask-image: radial-gradient(240px circle at var(--mx, -999px) var(--my, -999px), #000, transparent 70%); mask-image: radial-gradient(240px circle at var(--mx, -999px) var(--my, -999px), #000, transparent 70%) }
.hero h1.frame { position: relative; display: inline-block; margin-left: 0.42em; margin-right: 0.42em; font-size: clamp(38px, 6.2vw, 84px); line-height: 1.02; letter-spacing: -0.035em; max-width: 16ch }
.hero h1.frame .br { position: absolute; top: 0.06em; bottom: 0.02em; width: 0.2em; border: 0.065em solid var(--navy-900); transition: transform .9s cubic-bezier(.2, .7, .2, 1) .1s, opacity .4s .1s }
.hero h1.frame .br.l { left: -0.42em; border-right: 0 } .hero h1.frame .br.r { right: -0.42em; border-left: 0 }
.hero h1.frame .tx { display: block; transition: clip-path 1s cubic-bezier(.2, .7, .2, 1) .35s; clip-path: inset(-0.2em -0.2em -0.2em -0.2em) }
.sweep { display: block; height: 6px; width: 132px; background: var(--signal-500); transform: skewX(-14deg); transform-origin: left; margin: 0 0 22px 0.42em; transition: transform .8s cubic-bezier(.2, .7, .2, 1) .9s }
#hero .kicker, #hero .lead, #hero .byline, #hero .callout { transition: opacity .7s, transform .7s cubic-bezier(.2, .7, .2, 1) }
#hero .lead { transition-delay: .7s } #hero .byline { transition-delay: .85s }
.stat { border-top: 0; position: relative; padding-top: 14px; transition: opacity .6s, transform .6s cubic-bezier(.2, .7, .2, 1); transition-delay: calc(1s + var(--i, 0) * 90ms) }
.stat::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--navy-900); transform-origin: left; transition: transform .9s cubic-bezier(.2, .7, .2, 1); transition-delay: calc(1s + var(--i, 0) * 90ms) }
.stat .v { font-size: 40px }
.dist, .stat .meter, .health, .mtr .bar { transition: clip-path 1s cubic-bezier(.2, .7, .2, 1) .35s; clip-path: inset(0 0 0 0 round 999px) }
#hero .dist, #hero .stat .meter { transition-delay: 1.4s }

/* status: linha com marcos */

document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (!$('#modal').hidden) return fecharModal(); if (!$('#drawer').hidden) { $('#drawer').hidden = true; return; } if (!$('#bench').hidden) { $('#bench').hidden = true; $('#bench-frame').src = 'about:blank'; clearInterval(S.benchTimer); S.bench = null; publicaPresenca(null); renderCursores(); } });
// índice: marca a seção visível
const obs = 'IntersectionObserver' in window ? new IntersectionObserver((es) => { for (const en of es) if (en.isIntersecting) for (const a of document.querySelectorAll('#toc a')) a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id); }, { rootMargin: '-30% 0px -60% 0px' }) : null;

// ============================================================ MOVIMENTO
const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!calmo) document.documentElement.classList.add('anim');
function contar(root) {
  if (calmo) return;
  for (const el of root.querySelectorAll('[data-count]')) { const fim = +el.dataset.count, t0 = performance.now(), dur = 1100;
    // sem quadro de animação (aba em segundo plano), o número fica no valor final
    const passo = (t) => { const k = Math.max(0, Math.min(1, (t - t0 - 900) / dur)); el.textContent = Math.round(fim * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(passo); }; requestAnimationFrame(passo); }
}
// Cada bloco anima uma vez, quando entra na tela. Re-renderizações depois disso já nascem no estado final.
function revelar() {
  const els = [$('#hero'), ...document.querySelectorAll('section.sec')];
  // setTimeout e não requestAnimationFrame: em aba em segundo plano o quadro não vem e a página ficaria escondida
  const liga = (el) => { if (el.classList.contains('in')) return; setTimeout(() => { el.classList.add('in'); if (el.id === 'hero') contar(el); }, 40); };
  liga(els[0]); // a capa está sempre na primeira dobra: revela já, sem depender do observador (que não dispara em aba oculta)
  if (calmo || !('IntersectionObserver' in window)) { els.slice(1).forEach(liga); return; }
  const io = new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting) { liga(e.target); io.unobserve(e.target); } }, { rootMargin: '0px 0px -10% 0px' });
  els.slice(1).forEach((el) => io.observe(el));
}
// Grade de pontos da capa acende em volta do mouse.
if (!calmo && matchMedia('(pointer: fine)').matches) {
  let pend = null; const hero = $('#hero');
  hero.addEventListener('pointermove', (e) => { const r = hero.getBoundingClientRect(); pend = [e.clientX - r.left + 24, e.clientY - r.top];
    requestAnimationFrame(() => { if (pend) { hero.style.setProperty('--mx', pend[0] + 'px'); hero.style.setProperty('--my', pend[1] + 'px'); pend = null; } }); });
  hero.addEventListener('pointerleave', () => { hero.style.setProperty('--mx', '-999px'); });
}

// ============================================================ CARGA
// Nome do artefato e da aba: "Planejamento <cliente> · <nome curto>" (TEMPLATE.md, passo 6); a vitrine é o Template.
const tituloPlano = (p) => p.template ? 'Planejamento NOVARC · Template' : `Planejamento ${p.projeto.cliente} · ${p.projeto.nomeCurto || p.projeto.nome}`;
// Presença (capacidade room): cada visitante publica onde está (documento ou bancada), o cursor normalizado e a seção
// ou a mudança que vê. Nada é gravado: some quando a pessoa sai. Sem room, a página segue igual.
const PRES = { room: null, peers: [], chaveQuem: '', chaveVendo: '', ultimo: null, enviado: '' };
const outros = () => PRES.peers.filter((x) => !x.isMe && x.presence && typeof x.presence.x === 'number');
const nomeDe = (x) => (x.by && S.prof[x.by] && S.prof[x.by].name) || 'Alguém';
const corDe = (x) => (x.by && S.prof[x.by] && S.prof[x.by].color) || 'var(--navy-500)';
function vendoMud(id) {
  const v = outros().filter((x) => x.presence.modo === 'bench' && x.presence.chg === id);
  return v.length ? `<span class="vendo" id="vendo">${v.map((x) => `<i style="--c:${esc(corDe(x))}"></i>`).join('')}${esc(v.map(nomeDe).join(', '))} ${v.length > 1 ? 'estão' : 'está'} vendo esta mudança</span>` : '';
}
function renderQuem() {
  const pessoas = []; const vistos = new Set();
  for (const x of PRES.peers) { const k = x.by || x.peer; if (x.kind !== 'viewer' || vistos.has(k)) continue; vistos.add(k); pessoas.push(x); }
  pessoas.sort((a, b) => (b.isMe ? 1 : 0) - (a.isMe ? 1 : 0));
  const html = pessoas.length > 1 ? pessoas.slice(0, 6).map((x) => { const pf = x.by && S.prof[x.by]; const nm = x.isMe ? 'você' : nomeDe(x);
    return `<span class="av" style="--c:${esc(corDe(x))}" title="${esc(nm)}">${pf && pf.avatarUrl ? `<img src="${esc(pf.avatarUrl)}" alt="">` : esc((nm[0] || '?').toUpperCase())}</span>`; }).join('') + `<span class="n">${pessoas.length} no planejamento</span>` : '';
  for (const id of ['quem', 'quem-b']) { const el = document.getElementById(id); if (el) { el.innerHTML = html; el.hidden = !html; } }
}
function renderCursores() {
  const box = document.getElementById('cursores'); if (!box) return;
  const meu = S.bench ? 'bench' : 'doc'; const de = document.documentElement;
  const W = meu === 'bench' ? (window.innerWidth || 0) : (de.scrollWidth || 0), H = meu === 'bench' ? (window.innerHeight || 0) : (de.scrollHeight || 0);
  box.classList[meu === 'bench' ? 'add' : 'remove']('fixo');
  box.innerHTML = outros().filter((x) => x.presence.modo === meu && (meu === 'doc' || x.presence.sim === (S.bench && S.bench.sim))).map((x) =>
    `<div class="cur" style="--c:${esc(corDe(x))};transform:translate(${Math.round(x.presence.x * W)}px,${Math.round(x.presence.y * H)}px)"><svg width="16" height="18" viewBox="0 0 16 18"><path d="M1 1 L1 15 L5 11 L8 17 L10.5 16 L7.5 10 L13 10 Z" fill="${esc(corDe(x))}" stroke="#fff" stroke-width="1.2"/></svg><span>${esc(nomeDe(x))}</span></div>`).join('');
}
function secaoAtual() { const h = window.innerHeight || 800; let atual = 'hero'; for (const [k] of SECOES) { const el = document.getElementById(k); const r = el && el.getBoundingClientRect ? el.getBoundingClientRect() : null; if (r && r.top <= h * 0.3) atual = k; } return atual; }
function publicaPresenca(e) {
  if (!PRES.room) return; const de = document.documentElement; const b = S.bench;
  const x = e ? (b ? e.clientX / (window.innerWidth || 1) : e.pageX / (de.scrollWidth || 1)) : -1, y = e ? (b ? e.clientY / (window.innerHeight || 1) : e.pageY / (de.scrollHeight || 1)) : -1;
  const pr = { x: Math.round(x * 1000) / 1000, y: Math.round(y * 1000) / 1000, modo: b ? 'bench' : 'doc', sim: b ? b.sim : null, chg: b ? b.sel : null, sec: b ? null : secaoAtual() };
  const k = JSON.stringify(pr); if (k === PRES.enviado) return; PRES.enviado = k; PRES.room.presence(pr).catch(() => {});
}
// Agrupa os movimentos num por quadro. O simulador (iframe) repassa os seus já convertidos para a janela.
let agendadoPres = false;
function moverPresenca(e) { PRES.ultimo = e; if (agendadoPres || !PRES.room) return; agendadoPres = true; requestAnimationFrame(() => { agendadoPres = false; publicaPresenca(PRES.ultimo); }); }
function ligarPresenca(room) {
  PRES.room = room;
  document.addEventListener('pointermove', (e) => moverPresenca(e), { passive: true });
  document.addEventListener('pointerleave', () => publicaPresenca(null));
  room.onPeers(async (ch) => {
    PRES.peers = ch.peers; await resolverNomes(ch.peers.map((x) => x.by));
    const kq = PRES.peers.map((x) => (x.by || x.peer) + (x.isMe ? '*' : '')).sort().join(); if (kq !== PRES.chaveQuem) { PRES.chaveQuem = kq; renderQuem(); }
    renderCursores();
    const kv = S.bench && S.bench.sel ? vendoMud(S.bench.sel) : ''; if (kv !== PRES.chaveVendo) { PRES.chaveVendo = kv; if (S.bench) renderBench(); }
  }, () => { PRES.peers = []; renderQuem(); renderCursores(); });
  publicaPresenca(null);
}
async function resolverNomes(ids) { const novos = [...new Set(ids.filter((x) => x && !S.prof[x]))]; if (!novos.length || !S.user) return; try { Object.assign(S.prof, await S.user.profiles(novos)); } catch (e) {} }
async function conectar() {
  if (!window.claude || !window.claude.use) return;
  const [db, user, comments, downloads, room] = await Promise.all(['db', 'user', 'comments', 'downloads', 'room'].map((n) => window.claude.use(n).catch(() => null)));
  S.user = user; S.comments = comments; S.downloads = downloads;
  if (user) { try { const me = await user.me(); S.me = me.id; S.owner = !!me.isOwner; S.editor = !!me.canEdit; S.grava = await user.can('data.write'); } catch (e) {} }
  if (db) {
    S.db = db; const refaz = async (ids) => { await resolverNomes(ids); renderAll(); };
    db.doc('plano/estado').onSnapshot((s) => { S.estado = s.exists ? s.data() : null; refaz([S.estado && S.estado.by]); });
    db.doc('config/exibicao').onSnapshot((s) => { S.cfg = s.exists ? s.data() : null; renderAll(); });
    db.collection('historico').orderBy('at', 'desc').limit(50).onSnapshot((q) => { S.hist = q.docs.map((d) => d.data()); refaz(S.hist.map((h) => h.by)); });
    db.collection('pendencias').onSnapshot((q) => { S.resp = Object.fromEntries(q.docs.map((d) => [d.id, d.data()])); refaz(Object.values(S.resp).map((r) => r.by)); });
    db.collection('fases').onSnapshot((q) => { S.fasesOv = Object.fromEntries(q.docs.map((d) => [d.id, d.data()])); renderAll(); });
    db.collection('execucao').onSnapshot((q) => { S.exec = Object.fromEntries(q.docs.map((d) => [d.id, d.data()])); renderAll(); }, () => {});
    db.collection('specs').onSnapshot((q) => { S.specDb = Object.fromEntries(q.docs.map((d) => [d.id, d.data()])); renderAll(); }, () => {});
    db.doc('config/orquestracao').onSnapshot((s) => { S.orq = s.exists ? s.data() : null; renderAll(); }, () => {});
    db.collection('notas').orderBy('at', 'asc').onSnapshot((q) => { S.notas = q.docs.map((d) => d.data()); refaz(S.notas.map((n) => n.by)); });
    db.collection('documentos').orderBy('at', 'desc').onSnapshot((q) => { S.docs = q.docs.map((d) => d.data()); refaz(S.docs.map((d) => d.by)); });
    db.collection('videos').orderBy('at', 'desc').onSnapshot((q) => { S.videos = q.docs.map((d) => d.data()); refaz(S.videos.map((v) => v.by)); });
    if (interno()) db.collection('auditoria').orderBy('at', 'desc').limit(50).onSnapshot((q) => { S.aud = q.docs.map((d) => d.data()); renderAll(); }, () => {});
    if (interno()) db.collection('horas').orderBy('data', 'desc').onSnapshot((q) => { S.horas = q.docs.map((d) => d.data()); S.horasCarregadas = true; renderAll(); }, () => {});
  }
  if (room) ligarPresenca(room);
  renderAll();
}
fetch('plano.json').then((r) => r.json()).then((p) => {
  S.plano = p; document.title = tituloPlano(p); renderAll(); revelar(); if (obs) for (const [k] of SECOES) obs.observe(document.getElementById(k));
  const h = (location.hash || '').slice(1); const k = h.slice(0, 2), id = h.slice(2);
  if (k === 'm-' && S.plano.mudancas.some((m) => m.id === id)) abrirBench(S.plano.mudancas.find((m) => m.id === id).sim, id);
  else if ((k === 'd-' || k === 'p-') && id) irItem(k[0], id);
  else if (h) { const el = document.getElementById(h); if (el) el.scrollIntoView(); }
  conectar();
}).catch(() => { $('#hero').innerHTML = '<p class="kicker">Planejamento</p><h1>Não foi possível carregar o plano.json</h1>'; });
</script>
